<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" href="data:," />
<title>Grievances — Campus Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/styles.css">
</head>
<body>
  <div class="orb orb-violet"></div>
  <div class="orb orb-cyan"></div>
  <div class="orb orb-pink"></div>

  <header class="topbar">
    <div class="topbar-brand"><i data-lucide="graduation-cap"></i><span>Campus Portal</span></div>
    <div class="topbar-user">
      <span id="welcomeText">Loading...</span>
      <button id="signOutBtn" class="icon-btn" title="Sign out"><i data-lucide="log-out"></i></button>
    </div>
  </header>

  <nav class="portal-nav">
    <a href="index.html" class="nav-link"><i data-lucide="layout-dashboard"></i>Dashboard</a>
    <a href="grievances.html" class="nav-link active"><i data-lucide="message-square-warning"></i>Grievances</a>
    <a href="clubs.html" class="nav-link"><i data-lucide="users-round"></i>Clubs</a>
    <a href="placements.html" class="nav-link"><i data-lucide="briefcase"></i>Placements</a>
    <a href="fees.html" class="nav-link"><i data-lucide="banknote"></i>Fees</a>
    <a href="mentor-meetings.html" class="nav-link"><i data-lucide="calendar-check"></i>Mentor</a>
    <a href="exams.html" class="nav-link"><i data-lucide="calendar-clock"></i>Exams</a>
    <a href="results.html" class="nav-link"><i data-lucide="graduation-cap"></i>Results</a>
  </nav>

  <main class="page-shell">
    <h2>Grievances</h2>

    <div class="card section-gap">
      <h3><i data-lucide="message-square-plus"></i>Submit a grievance</h3>
      <div id="grievanceError" class="error-msg"></div>
      <form id="grievanceForm">
        <div class="form-grid" style="margin-bottom:16px;">
          <div class="field">
            <label for="category">Category</label>
            <select id="category">
              <option value="academic">Academic</option>
              <option value="hostel">Hostel</option>
              <option value="infrastructure">Infrastructure</option>
              <option value="harassment">Harassment</option>
              <option value="other">Other</option>
            </select>
          </div>
          <div class="field">
            <label for="subject">Subject</label>
            <div class="input-wrap"><i data-lucide="type"></i><input type="text" id="subject" required /></div>
          </div>
        </div>
        <div class="field" style="margin-bottom:16px;">
          <label for="description">Description</label>
          <textarea id="description" rows="4" required></textarea>
        </div>
        <label class="checkbox-label" style="margin-bottom:20px;">
          <input type="checkbox" id="isAnonymous" />
          <span>Submit anonymously (hidden from other students; staff resolving it can still see who filed it)</span>
        </label>
        <button type="submit" class="btn btn-primary" id="submitGrievanceBtn">
          <span id="submitGrievanceBtnText">Submit</span>
          <i data-lucide="arrow-right" class="arrow-icon icon-idle"></i>
          <i data-lucide="loader-2" class="arrow-icon icon-loading spin" style="display:none;"></i>
        </button>
      </form>
    </div>

    <div class="card">
      <h3><i data-lucide="list"></i>My grievances</h3>
      <div id="grievancesList"><p class="text-muted">Loading...</p></div>
    </div>
  </main>

  <div id="toast" class="toast"></div>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../shared/supabase-client.js"></script>
  <script>window.REQUIRED_ROLE = 'student';</script>
  <script src="../shared/auth-guard.js"></script>
  <script src="../shared/toast.js"></script>
  <script src="grievances.js"></script>

  <script src="../shared/sidebar.js"></script>
</body>
</html>
