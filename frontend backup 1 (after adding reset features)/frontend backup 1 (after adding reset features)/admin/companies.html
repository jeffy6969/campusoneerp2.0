<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" href="data:," />
<title>Placements — Campus Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/styles.css">
</head>
<body>
  <div class="orb orb-violet"></div>
  <div class="orb orb-cyan"></div>
  <div class="orb orb-pink"></div>

  <header class="topbar">
    <div class="topbar-brand"><i data-lucide="graduation-cap"></i><span>Campus Portal</span></div>
    <div class="topbar-user">
      <span id="welcomeText">Loading...</span>
      <button id="signOutBtn" class="icon-btn" title="Sign out"><i data-lucide="log-out"></i></button>
    </div>
  </header>

  <nav class="portal-nav">
    <a href="index.html" class="nav-link"><i data-lucide="users"></i>Users</a>
    <a href="departments.html" class="nav-link"><i data-lucide="building-2"></i>Departments</a>
    <a href="courses.html" class="nav-link"><i data-lucide="book-open"></i>Courses</a>
    <a href="rooms-slots.html" class="nav-link"><i data-lucide="door-open"></i>Rooms &amp; Slots</a>
    <a href="timetable.html" class="nav-link"><i data-lucide="calendar-range"></i>Timetable</a>
    <a href="fees.html" class="nav-link"><i data-lucide="banknote"></i>Fees</a>
    <a href="clubs.html" class="nav-link"><i data-lucide="users-round"></i>Clubs</a>
    <a href="companies.html" class="nav-link active"><i data-lucide="briefcase"></i>Placements</a>
    <a href="mentors.html" class="nav-link"><i data-lucide="user-check"></i>Mentors</a>
    <a href="grievances.html" class="nav-link"><i data-lucide="message-square-warning"></i>Grievances</a>
    <a href="exams.html" class="nav-link"><i data-lucide="calendar-clock"></i>Exams</a>
  </nav>

  <main class="page-shell">
    <h2>Placements</h2>

    <div class="split-layout section-gap">
      <div class="card">
        <h3><i data-lucide="building"></i>Add company</h3>
        <div id="companyError" class="error-msg"></div>
        <form id="companyForm">
          <div class="field" style="margin-bottom:16px;">
            <label for="companyName">Name</label>
            <div class="input-wrap"><i data-lucide="building"></i><input type="text" id="companyName" required /></div>
          </div>
          <div class="field" style="margin-bottom:16px;">
            <label for="companyWebsite">Website</label>
            <div class="input-wrap"><i data-lucide="link"></i><input type="text" id="companyWebsite" placeholder="https://..." /></div>
          </div>
          <div class="field" style="margin-bottom:16px;">
            <label for="companyDescription">Description</label>
            <textarea id="companyDescription" rows="3"></textarea>
          </div>
          <button type="submit" class="btn btn-primary btn-full"><span>Add company</span><i data-lucide="arrow-right" class="arrow-icon"></i></button>
        </form>
      </div>
      <div class="card">
        <h3><i data-lucide="list"></i>All companies</h3>
        <div id="companiesList"><p class="text-muted">Loading...</p></div>
      </div>
    </div>

    <div class="card section-gap">
      <h3><i data-lucide="briefcase"></i>Add job posting</h3>
      <div id="jobError" class="error-msg"></div>
      <form id="jobForm">
        <div class="form-grid" style="margin-bottom:16px;">
          <div class="field">
            <label for="jobCompany">Company</label>
            <select id="jobCompany"><option value="">Select company</option></select>
          </div>
          <div class="field">
            <label for="jobTitle">Title</label>
            <div class="input-wrap"><i data-lucide="type"></i><input type="text" id="jobTitle" required /></div>
          </div>
          <div class="field">
            <label for="jobType">Type</label>
            <select id="jobType">
              <option value="full_time">Full time</option>
              <option value="internship">Internship</option>
              <option value="both">Both</option>
            </select>
          </div>
          <div class="field">
            <label for="jobMinCgpa">Min CGPA</label>
            <div class="input-wrap"><i data-lucide="award"></i><input type="number" id="jobMinCgpa" step="0.1" min="0" max="10" /></div>
          </div>
          <div class="field">
            <label for="jobDeadline">Application deadline</label>
            <div class="input-wrap"><i data-lucide="calendar"></i><input type="date" id="jobDeadline" /></div>
          </div>
        </div>
        <div class="field" style="margin-bottom:16px;">
          <label for="jobDescription">Description</label>
          <textarea id="jobDescription" rows="3"></textarea>
        </div>
        <div class="field" style="margin-bottom:20px;">
          <label>Eligible departments</label>
          <div id="jobDeptCheckboxes" class="checkbox-grid"></div>
        </div>
        <button type="submit" class="btn btn-primary" id="jobBtn"><span>Post job</span><i data-lucide="arrow-right" class="arrow-icon"></i></button>
      </form>
    </div>

    <div class="card">
      <h3><i data-lucide="list"></i>All postings</h3>
      <div id="jobsList"><p class="text-muted">Loading...</p></div>
    </div>

    <div class="card" style="margin-top:24px;">
      <h3><i data-lucide="users"></i>Applicants</h3>
      <div class="field" style="margin-bottom:16px;">
        <label for="applicantsJobSelect">Job posting</label>
        <select id="applicantsJobSelect"><option value="">Select a posting</option></select>
      </div>
      <div id="applicantsList"><p class="text-muted">Select a posting to see applicants.</p></div>
    </div>
  </main>

  <div id="toast" class="toast"></div>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../shared/supabase-client.js"></script>
  <script>window.REQUIRED_ROLE = 'admin';</script>
  <script src="../shared/auth-guard.js"></script>
  <script src="../shared/toast.js"></script>
  <script src="companies.js"></script>

  <script src="../shared/sidebar.js"></script>
</body>
</html>
