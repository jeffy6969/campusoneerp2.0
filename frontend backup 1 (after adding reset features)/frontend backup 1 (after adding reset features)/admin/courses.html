<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" href="data:," />
<title>Courses — Campus Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/styles.css">
</head>
<body>
  <div class="orb orb-violet"></div>
  <div class="orb orb-cyan"></div>
  <div class="orb orb-pink"></div>

  <header class="topbar">
    <div class="topbar-brand"><i data-lucide="graduation-cap"></i><span>Campus Portal</span></div>
    <div class="topbar-user">
      <span id="welcomeText">Loading...</span>
      <button id="signOutBtn" class="icon-btn" title="Sign out"><i data-lucide="log-out"></i></button>
    </div>
  </header>

  <nav class="portal-nav">
    <a href="index.html" class="nav-link"><i data-lucide="users"></i>Users</a>
    <a href="departments.html" class="nav-link"><i data-lucide="building-2"></i>Departments</a>
    <a href="courses.html" class="nav-link active"><i data-lucide="book-open"></i>Courses</a>
    <a href="rooms-slots.html" class="nav-link"><i data-lucide="door-open"></i>Rooms &amp; Slots</a>
    <a href="timetable.html" class="nav-link"><i data-lucide="calendar-range"></i>Timetable</a>
    <a href="fees.html" class="nav-link"><i data-lucide="banknote"></i>Fees</a>
    <a href="clubs.html" class="nav-link"><i data-lucide="users-round"></i>Clubs</a>
    <a href="companies.html" class="nav-link"><i data-lucide="briefcase"></i>Placements</a>
    <a href="mentors.html" class="nav-link"><i data-lucide="user-check"></i>Mentors</a>
    <a href="grievances.html" class="nav-link"><i data-lucide="message-square-warning"></i>Grievances</a>
    <a href="exams.html" class="nav-link"><i data-lucide="calendar-clock"></i>Exams</a>
  </nav>

  <main class="page-shell">
    <h2>Courses</h2>
    <div class="split-layout">
      <div class="card">
        <h3><i data-lucide="book-open"></i>Add course</h3>
        <div id="courseError" class="error-msg"></div>
        <form id="courseForm">
          <div class="field" style="margin-bottom:16px;">
            <label for="courseCode">Code</label>
            <div class="input-wrap"><i data-lucide="hash"></i><input type="text" id="courseCode" placeholder="CS3591" required /></div>
          </div>
          <div class="field" style="margin-bottom:16px;">
            <label for="courseName">Name</label>
            <div class="input-wrap"><i data-lucide="type"></i><input type="text" id="courseName" required /></div>
          </div>
          <div class="field" style="margin-bottom:16px;">
            <label for="courseDept">Department</label>
            <select id="courseDept"><option value="">Select department</option></select>
          </div>
          <div class="field" style="margin-bottom:16px;">
            <label for="courseSemester">Semester</label>
            <div class="input-wrap"><i data-lucide="calendar"></i><input type="number" id="courseSemester" min="1" max="8" required /></div>
          </div>
          <div class="field" style="margin-bottom:16px;">
            <label for="courseCredits">Credits</label>
            <div class="input-wrap"><i data-lucide="star"></i><input type="number" id="courseCredits" step="0.5" required /></div>
          </div>
          <div class="field" style="margin-bottom:16px;">
            <label for="courseType">Type</label>
            <select id="courseType">
              <option value="core">Core</option>
              <option value="elective">Elective</option>
              <option value="lab">Lab</option>
            </select>
          </div>
          <button type="submit" class="btn btn-primary btn-full"><span>Add course</span><i data-lucide="arrow-right" class="arrow-icon"></i></button>
        </form>
      </div>
      <div class="card">
        <h3><i data-lucide="list"></i>All courses</h3>
        <div class="table-wrap">
          <table class="data-table">
            <thead><tr><th>Code</th><th>Name</th><th>Dept</th><th>Sem</th><th>Type</th></tr></thead>
            <tbody id="coursesTableBody"><tr><td colspan="5" class="text-muted">Loading...</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <div id="toast" class="toast"></div>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../shared/supabase-client.js"></script>
  <script>window.REQUIRED_ROLE = 'admin';</script>
  <script src="../shared/auth-guard.js"></script>
  <script src="../shared/toast.js"></script>
  <script src="courses.js"></script>

  <script src="../shared/sidebar.js"></script>
</body>
</html>
