<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" href="data:," />
<title>Rooms &amp; Slots — Campus Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/styles.css">
</head>
<body>
  <div class="orb orb-violet"></div>
  <div class="orb orb-cyan"></div>
  <div class="orb orb-pink"></div>

  <header class="topbar">
    <div class="topbar-brand"><i data-lucide="graduation-cap"></i><span>Campus Portal</span></div>
    <div class="topbar-user">
      <span id="welcomeText">Loading...</span>
      <button id="signOutBtn" class="icon-btn" title="Sign out"><i data-lucide="log-out"></i></button>
    </div>
  </header>

  <nav class="portal-nav">
    <a href="index.html" class="nav-link"><i data-lucide="users"></i>Users</a>
    <a href="departments.html" class="nav-link"><i data-lucide="building-2"></i>Departments</a>
    <a href="courses.html" class="nav-link"><i data-lucide="book-open"></i>Courses</a>
    <a href="rooms-slots.html" class="nav-link active"><i data-lucide="door-open"></i>Rooms &amp; Slots</a>
    <a href="timetable.html" class="nav-link"><i data-lucide="calendar-range"></i>Timetable</a>
    <a href="fees.html" class="nav-link"><i data-lucide="banknote"></i>Fees</a>
    <a href="clubs.html" class="nav-link"><i data-lucide="users-round"></i>Clubs</a>
    <a href="companies.html" class="nav-link"><i data-lucide="briefcase"></i>Placements</a>
    <a href="mentors.html" class="nav-link"><i data-lucide="user-check"></i>Mentors</a>
    <a href="grievances.html" class="nav-link"><i data-lucide="message-square-warning"></i>Grievances</a>
    <a href="exams.html" class="nav-link"><i data-lucide="calendar-clock"></i>Exams</a>
  </nav>

  <main class="page-shell">
    <h2>Rooms &amp; Timetable Slots</h2>

    <div class="split-layout section-gap">
      <div class="card">
        <h3><i data-lucide="door-open"></i>Add room</h3>
        <div id="roomError" class="error-msg"></div>
        <form id="roomForm">
          <div class="field" style="margin-bottom:16px;">
            <label for="roomNumber">Room number</label>
            <div class="input-wrap"><i data-lucide="door-open"></i><input type="text" id="roomNumber" placeholder="301" required /></div>
          </div>
          <div class="field" style="margin-bottom:16px;">
            <label for="roomCapacity">Capacity</label>
            <div class="input-wrap"><i data-lucide="users"></i><input type="number" id="roomCapacity" /></div>
          </div>
          <div class="field" style="margin-bottom:16px;">
            <label for="roomType">Type</label>
            <select id="roomType">
              <option value="classroom">Classroom</option>
              <option value="lab">Lab</option>
              <option value="seminar_hall">Seminar hall</option>
            </select>
          </div>
          <button type="submit" class="btn btn-primary btn-full"><span>Add room</span><i data-lucide="arrow-right" class="arrow-icon"></i></button>
        </form>
      </div>
      <div class="card">
        <h3><i data-lucide="list"></i>All rooms</h3>
        <div id="roomsList"><p class="text-muted">Loading...</p></div>
      </div>
    </div>

    <div class="split-layout">
      <div class="card">
        <h3><i data-lucide="clock"></i>Add timetable slot</h3>
        <div id="slotError" class="error-msg"></div>
        <form id="slotForm">
          <div class="field" style="margin-bottom:16px;">
            <label for="slotDay">Day</label>
            <select id="slotDay">
              <option value="1">Monday</option>
              <option value="2">Tuesday</option>
              <option value="3">Wednesday</option>
              <option value="4">Thursday</option>
              <option value="5">Friday</option>
              <option value="6">Saturday</option>
            </select>
          </div>
          <div class="field" style="margin-bottom:16px;">
            <label for="slotPeriod">Period number</label>
            <div class="input-wrap"><i data-lucide="hash"></i><input type="number" id="slotPeriod" min="1" max="8" required /></div>
          </div>
          <div class="field" style="margin-bottom:16px;">
            <label for="slotStart">Start time</label>
            <div class="input-wrap"><i data-lucide="clock"></i><input type="time" id="slotStart" required /></div>
          </div>
          <div class="field" style="margin-bottom:16px;">
            <label for="slotEnd">End time</label>
            <div class="input-wrap"><i data-lucide="clock"></i><input type="time" id="slotEnd" required /></div>
          </div>
          <button type="submit" class="btn btn-primary btn-full"><span>Add slot</span><i data-lucide="arrow-right" class="arrow-icon"></i></button>
        </form>
      </div>
      <div class="card">
        <h3><i data-lucide="list"></i>All slots</h3>
        <div id="slotsList"><p class="text-muted">Loading...</p></div>
      </div>
    </div>
  </main>

  <div id="toast" class="toast"></div>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../shared/supabase-client.js"></script>
  <script>window.REQUIRED_ROLE = 'admin';</script>
  <script src="../shared/auth-guard.js"></script>
  <script src="../shared/toast.js"></script>
  <script src="rooms-slots.js"></script>

  <script src="../shared/sidebar.js"></script>
</body>
</html>
