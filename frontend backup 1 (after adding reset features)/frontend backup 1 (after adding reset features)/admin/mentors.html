<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" href="data:," />
<title>Mentors — Campus Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/styles.css">
</head>
<body>
  <div class="orb orb-violet"></div>
  <div class="orb orb-cyan"></div>
  <div class="orb orb-pink"></div>

  <header class="topbar">
    <div class="topbar-brand"><i data-lucide="graduation-cap"></i><span>Campus Portal</span></div>
    <div class="topbar-user">
      <span id="welcomeText">Loading...</span>
      <button id="signOutBtn" class="icon-btn" title="Sign out"><i data-lucide="log-out"></i></button>
    </div>
  </header>

  <nav class="portal-nav">
    <a href="index.html" class="nav-link"><i data-lucide="users"></i>Users</a>
    <a href="departments.html" class="nav-link"><i data-lucide="building-2"></i>Departments</a>
    <a href="courses.html" class="nav-link"><i data-lucide="book-open"></i>Courses</a>
    <a href="rooms-slots.html" class="nav-link"><i data-lucide="door-open"></i>Rooms &amp; Slots</a>
    <a href="timetable.html" class="nav-link"><i data-lucide="calendar-range"></i>Timetable</a>
    <a href="fees.html" class="nav-link"><i data-lucide="banknote"></i>Fees</a>
    <a href="clubs.html" class="nav-link"><i data-lucide="users-round"></i>Clubs</a>
    <a href="companies.html" class="nav-link"><i data-lucide="briefcase"></i>Placements</a>
    <a href="mentors.html" class="nav-link active"><i data-lucide="user-check"></i>Mentors</a>
    <a href="grievances.html" class="nav-link"><i data-lucide="message-square-warning"></i>Grievances</a>
    <a href="exams.html" class="nav-link"><i data-lucide="calendar-clock"></i>Exams</a>
  </nav>

  <main class="page-shell">
    <h2>Mentors</h2>

    <div class="split-layout section-gap">
      <div class="card">
        <h3><i data-lucide="user-check"></i>Designate a mentor</h3>
        <div id="mentorDesignateError" class="error-msg"></div>
        <form id="designateForm">
          <div class="field" style="margin-bottom:16px;">
            <label for="designateTeacher">Teacher</label>
            <select id="designateTeacher"><option value="">Select teacher</option></select>
          </div>
          <div class="field" style="margin-bottom:16px;">
            <label for="maxMentees">Max mentees</label>
            <div class="input-wrap"><i data-lucide="users"></i><input type="number" id="maxMentees" value="15" /></div>
          </div>
          <button type="submit" class="btn btn-primary btn-full"><span>Make mentor</span><i data-lucide="arrow-right" class="arrow-icon"></i></button>
        </form>
      </div>
      <div class="card">
        <h3><i data-lucide="list"></i>Current mentors</h3>
        <div id="mentorsList"><p class="text-muted">Loading...</p></div>
      </div>
    </div>

    <div class="card">
      <h3><i data-lucide="user-plus"></i>Assign a mentor to a student</h3>
      <div id="assignError" class="error-msg"></div>
      <div class="form-grid" style="margin-bottom:16px;">
        <div class="field">
          <label for="studentRollLookup">Student roll number</label>
          <div class="input-wrap"><i data-lucide="hash"></i><input type="text" id="studentRollLookup" placeholder="2026CSE0001" /></div>
        </div>
        <div class="field">
          <label>&nbsp;</label>
          <button class="btn btn-secondary btn-full" id="lookupStudentBtn" type="button"><span>Find student</span></button>
        </div>
      </div>
      <div id="foundStudentInfo" style="display:none;">
        <p class="text-muted" style="margin-bottom:16px;">Found: <strong id="foundStudentName"></strong> — current mentor: <strong id="foundStudentMentor"></strong></p>
        <div class="field" style="margin-bottom:16px;">
          <label for="assignMentorSelect">Assign mentor</label>
          <select id="assignMentorSelect"><option value="">Select mentor</option></select>
        </div>
        <button class="btn btn-primary" id="assignBtn" type="button"><span>Assign</span><i data-lucide="arrow-right" class="arrow-icon"></i></button>
      </div>
    </div>
  </main>

  <div id="toast" class="toast"></div>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../shared/supabase-client.js"></script>
  <script>window.REQUIRED_ROLE = 'admin';</script>
  <script src="../shared/auth-guard.js"></script>
  <script src="../shared/toast.js"></script>
  <script src="mentors.js"></script>

  <script src="../shared/sidebar.js"></script>
</body>
</html>
