<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" href="data:," />
<title>Exams — Campus Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/styles.css">
</head>
<body>
  <div class="orb orb-violet"></div>
  <div class="orb orb-cyan"></div>
  <div class="orb orb-pink"></div>

  <header class="topbar">
    <div class="topbar-brand"><i data-lucide="graduation-cap"></i><span>Campus Portal</span></div>
    <div class="topbar-user">
      <span id="welcomeText">Loading...</span>
      <button id="signOutBtn" class="icon-btn" title="Sign out"><i data-lucide="log-out"></i></button>
    </div>
  </header>

  <nav class="portal-nav">
    <a href="index.html" class="nav-link"><i data-lucide="users"></i>Users</a>
    <a href="departments.html" class="nav-link"><i data-lucide="building-2"></i>Departments</a>
    <a href="courses.html" class="nav-link"><i data-lucide="book-open"></i>Courses</a>
    <a href="rooms-slots.html" class="nav-link"><i data-lucide="door-open"></i>Rooms &amp; Slots</a>
    <a href="timetable.html" class="nav-link"><i data-lucide="calendar-range"></i>Timetable</a>
    <a href="fees.html" class="nav-link"><i data-lucide="banknote"></i>Fees</a>
    <a href="clubs.html" class="nav-link"><i data-lucide="users-round"></i>Clubs</a>
    <a href="companies.html" class="nav-link"><i data-lucide="briefcase"></i>Placements</a>
    <a href="mentors.html" class="nav-link"><i data-lucide="user-check"></i>Mentors</a>
    <a href="grievances.html" class="nav-link"><i data-lucide="message-square-warning"></i>Grievances</a>
    <a href="exams.html" class="nav-link active"><i data-lucide="calendar-clock"></i>Exams</a>
  </nav>

  <main class="page-shell">
    <h2>Exams</h2>
    <div class="split-layout">
      <div class="card">
        <h3><i data-lucide="calendar-clock"></i>Schedule an exam</h3>
        <div id="examError" class="error-msg"></div>
        <form id="examForm">
          <div class="field" style="margin-bottom:16px;">
            <label for="examCourse">Course</label>
            <select id="examCourse"><option value="">Select course</option></select>
          </div>
          <div class="field" style="margin-bottom:16px;">
            <label for="examType">Exam type</label>
            <select id="examType">
              <option value="internal_1">Internal 1</option>
              <option value="internal_2">Internal 2</option>
              <option value="model">Model exam</option>
              <option value="semester_end">Semester end</option>
            </select>
          </div>
          <div class="field" style="margin-bottom:16px;">
            <label for="examDate">Date</label>
            <div class="input-wrap"><i data-lucide="calendar"></i><input type="date" id="examDate" required /></div>
          </div>
          <div class="field" style="margin-bottom:16px;">
            <label for="examStart">Start time</label>
            <div class="input-wrap"><i data-lucide="clock"></i><input type="time" id="examStart" /></div>
          </div>
          <div class="field" style="margin-bottom:16px;">
            <label for="examEnd">End time</label>
            <div class="input-wrap"><i data-lucide="clock"></i><input type="time" id="examEnd" /></div>
          </div>
          <div class="field" style="margin-bottom:16px;">
            <label for="examMaxMarks">Max marks</label>
            <div class="input-wrap"><i data-lucide="star"></i><input type="number" id="examMaxMarks" value="100" /></div>
          </div>
          <div class="field" style="margin-bottom:16px;">
            <label for="examYear">Academic year</label>
            <div class="input-wrap"><i data-lucide="calendar"></i><input type="text" id="examYear" placeholder="2026-27" required /></div>
          </div>
          <button type="submit" class="btn btn-primary btn-full"><span>Schedule exam</span><i data-lucide="arrow-right" class="arrow-icon"></i></button>
        </form>
      </div>
      <div class="card">
        <h3><i data-lucide="list"></i>All exams</h3>
        <div class="table-wrap">
          <table class="data-table">
            <thead><tr><th>Course</th><th>Type</th><th>Date</th><th>Max marks</th></tr></thead>
            <tbody id="examsTableBody"><tr><td colspan="4" class="text-muted">Loading...</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <div id="toast" class="toast"></div>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../shared/supabase-client.js"></script>
  <script>window.REQUIRED_ROLE = 'admin';</script>
  <script src="../shared/auth-guard.js"></script>
  <script src="../shared/toast.js"></script>
  <script src="exams.js"></script>

  <script src="../shared/sidebar.js"></script>
</body>
</html>
